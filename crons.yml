crons:
  - name: weekly-report
    description: "Informe semanal de instalaciones y aviso a todos, lunes 9:00 hora de España"
    cron: "0 9 * * 1"
    timezone: "Europe/Madrid"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/weekly-report"
    method: POST
    enabled: true
